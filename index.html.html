<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Planilla Docente - Asistencia y Calificaciones</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --presente: #10b981;
      --ausente: #ef4444;
      --tarde: #f59e0b;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; }

    header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    
    .sync-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .sync-panel details summary { cursor: pointer; color: var(--muted); outline: none; }
    .sync-inputs { display: flex; gap: 6px; margin-top: 8px; }
    .sync-inputs input {
      flex: 1; background: #0b1120; border: 1px solid var(--border);
      color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 0.75rem;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .control-item { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    select, input[type="date"] {
      background: #0b1120; border: 1px solid var(--border); color: var(--text);
      padding: 8px; border-radius: 6px; font-size: 0.85rem; outline: none;
    }

    .summary-bar {
      display: flex; justify-content: space-around; background: #162032;
      border: 1px solid var(--border); border-radius: 8px; padding: 8px;
      margin: 10px 0; font-size: 0.8rem; font-weight: 600;
    }
    .badge-p { color: var(--presente); }
    .badge-a { color: var(--ausente); }
    .badge-t { color: var(--tarde); }

    .student-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .student-info { display: flex; flex-direction: column; flex: 1; }
    .student-name { font-size: 0.95rem; font-weight: 600; }
    .student-id { font-size: 0.75rem; color: var(--muted); }

    .actions { display: flex; align-items: center; gap: 8px; }

    .btn-asistencia {
      width: 44px; height: 44px; border-radius: 8px; border: none;
      font-weight: 700; font-size: 1rem; color: #fff; cursor: pointer;
      touch-action: manipulation;
    }
    .btn-P { background-color: var(--presente); }
    .btn-A { background-color: var(--ausente); }
    .btn-T { background-color: var(--tarde); }

    .input-nota {
      width: 46px; height: 44px; text-align: center; font-size: 1rem;
      font-weight: 700; border-radius: 8px; border: 1px solid var(--border);
      background: #0b1120; color: var(--text); outline: none;
    }
    .input-nota:focus { border-color: var(--accent); }

    .footer-actions {
      position: sticky; bottom: 8px; display: flex; gap: 8px; margin-top: 16px;
    }
    .btn-action {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .btn-sync { background: var(--accent); color: #0b1120; }
    .btn-add { background: #334155; color: #fff; }

    #toast {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      background: #0284c7; color: white; padding: 8px 16px; border-radius: 20px;
      font-size: 0.8rem; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>Registro Técnico</h1>
      <span id="sync-status" style="font-size: 0.75rem; color: var(--muted);">Local OK</span>
    </div>

    <div class="sync-panel">
      <details>
        <summary>Configurar sincronización Sheets (opcional)</summary>
        <div class="sync-inputs">
          <input type="url" id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec">
          <button class="btn-action btn-sync" style="flex: 0 0 auto; padding: 6px 12px;" onclick="guardarUrl()">Guardar</button>
        </div>
      </details>
    </div>

    <div class="controls-grid">
      <div class="control-item">
        <label>Curso / Materia</label>
        <select id="selCurso" onchange="cambiarCurso()">
          <option value="4-3-MPE">4° 3° - Montaje Proyectos</option>
          <option value="4-EA">4° - Electrónica Analógica</option>
          <option value="5-DAS">5° - Diseño Apl. Secuenciales</option>
          <option value="4-SO">4° - Sist. Operativos</option>
        </select>
      </div>
      <div class="control-item">
        <label>Fecha</label>
        <input type="date" id="fechaRegistro" onchange="cargarDatosFecha()">
      </div>
    </div>
  </header>

  <div class="summary-bar">
    <span>Presentes: <strong id="cnt-p" class="badge-p">0</strong></span>
    <span>Ausentes: <strong id="cnt-a" class="badge-a">0</strong></span>
    <span>Tardes: <strong id="cnt-t" class="badge-t">0</strong></span>
  </div>

  <main id="listaAlumnos"></main>

  <div class="footer-actions">
    <button class="btn-action btn-add" onclick="agregarAlumnoPrompt()">+ Alumno</button>
    <button class="btn-action btn-sync" onclick="sincronizarConNube()">Sincronizar</button>
  </div>

  <div id="toast"></div>

  <script>
    // Inicializar fecha de hoy
    document.getElementById("fechaRegistro").value = new Date().toISOString().split("T")[0];

    // Cursos predeterminados
    const baseDatos = JSON.parse(localStorage.getItem("registro_docente_data")) || {
      "4-3-MPE": [
        { id: 1, nombre: "Acosta, Mateo", estado: "P", nota: "" },
        { id: 2, nombre: "Benítez, Lucas", estado: "P", nota: "" },
        { id: 3, nombre: "Cardozo, Sofía", estado: "A", nota: "8" },
        { id: 4, nombre: "Díaz, Franco", estado: "P", nota: "" }
      ],
      "4-EA": [
        { id: 1, nombre: "Álvarez, Julián", estado: "P", nota: "" },
        { id: 2, nombre: "Gómez, Lautaro", estado: "P", nota: "" }
      ],
      "5-DAS": [],
      "4-SO": []
    };

    let cursoActual = document.getElementById("selCurso").value;

    function renderAlumnos() {
      const contenedor = document.getElementById("listaAlumnos");
      contenedor.innerHTML = "";
      const lista = baseDatos[cursoActual] || [];

      let cp = 0, ca = 0, ct = 0;

      lista.forEach((al, idx) => {
        if (al.estado === "P") cp++;
        if (al.estado === "A") ca++;
        if (al.estado === "T") ct++;

        const card = document.createElement("div");
        card.className = "student-card";
        card.innerHTML = `
          <div class="student-info">
            <span class="student-name">${al.nombre}</span>
            <span class="student-id">N° ${idx + 1}</span>
          </div>
          <div class="actions">
            <input type="text" 
                   class="input-nota" 
                   inputmode="numeric" 
                   placeholder="-" 
                   value="${al.nota || ''}" 
                   onchange="validarNota(this, ${idx})">
            <button class="btn-asistencia btn-${al.estado}" 
                    onclick="alternarAsistencia(${idx})">${al.estado}</button>
          </div>
        `;
        contenedor.appendChild(card);
      });

      document.getElementById("cnt-p").textContent = cp;
      document.getElementById("cnt-a").textContent = ca;
      document.getElementById("cnt-t").textContent = ct;
      guardarEnStorage();
    }

    // Rotación de asistencia: P -> A -> T -> P
    function alternarAsistencia(idx) {
      const estados = ["P", "A", "T"];
      let actual = baseDatos[cursoActual][idx].estado;
      let nuevoIndex = (estados.indexOf(actual) + 1) % estados.length;
      baseDatos[cursoActual][idx].estado = estados[nuevoIndex];
      renderAlumnos();
    }

    // Validación anti-error de notas (1 al 10)
    function validarNota(input, idx) {
      let v = input.value.trim();
      if (v === "") {
        baseDatos[cursoActual][idx].nota = "";
        guardarEnStorage();
        return;
      }
      let n = parseFloat(v.replace(",", "."));
      if (isNaN(n) || n < 1 || n > 10) {
        mostrarToast("⚠️ Nota inválida (ingrese de 1 a 10)");
        input.value = baseDatos[cursoActual][idx].nota || "";
      } else {
        baseDatos[cursoActual][idx].nota = n.toString();
        guardarEnStorage();
        mostrarToast(`Nota guardada: ${n}`);
      }
    }

    function cambiarCurso() {
      cursoActual = document.getElementById("selCurso").value;
      renderAlumnos();
    }

    function cargarDatosFecha() {
      mostrarToast("Fecha actualizada");
      renderAlumnos();
    }

    function agregarAlumnoPrompt() {
      const nom = prompt("Apellido y Nombre del estudiante:");
      if (nom && nom.trim() !== "") {
        if (!baseDatos[cursoActual]) baseDatos[cursoActual] = [];
        baseDatos[cursoActual].push({
          id: Date.now(),
          nombre: nom.trim(),
          estado: "P",
          nota: ""
        });
        renderAlumnos();
      }
    }

    function guardarEnStorage() {
      localStorage.setItem("registro_docente_data", JSON.stringify(baseDatos));
    }

    function mostrarToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.opacity = "1";
      setTimeout(() => { t.style.opacity = "0"; }, 2000);
    }

    function guardarUrl() {
      const url = document.getElementById("sheetUrl").value.trim();
      localStorage.setItem("script_url_sync", url);
      mostrarToast("URL guardada");
    }

    async function sincronizarConNube() {
      const url = localStorage.getItem("script_url_sync") || document.getElementById("sheetUrl").value.trim();
      if (!url) {
        mostrarToast("Pegá la URL de Apps Script arriba para sincronizar");
        return;
      }

      mostrarToast("Sincronizando...");
      try {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fecha: document.getElementById("fechaRegistro").value,
            curso: cursoActual,
            datos: baseDatos[cursoActual]
          })
        });
        document.getElementById("sync-status").textContent = "Nube OK";
        mostrarToast("¡Sincronizado con Sheets!");
      } catch (err) {
        mostrarToast("Error al conectar");
      }
    }

    // Cargar URL guardada si existe
    const savedUrl = localStorage.getItem("script_url_sync");
    if (savedUrl) document.getElementById("sheetUrl").value = savedUrl;

    renderAlumnos();
  </script>
</body>
</html>
